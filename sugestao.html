<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeSuaopiniãoSemTabus!</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe" crossorigin="anonymous">
    <link rel="stylesheet" href="./decoration.css">
</head>

<body class="fundoformulario">
    <h1>Não guarde seus pensamentos na sua mente! Escreva para nós o que acha do nosso site~ Juramos que não mordemos
        hehehe!</h1>
    <form method="post" action="./resposta.html">
        <label for="nome" class="texto">Nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Como quiser ser referenciado~" size="75"><br>
        <label for="email" class="texto">E-mail:</label>
        <input type="email" id="email" name="email" placeholder="Ex@gmail.com" size="75"><br>
        <label for="religiao" class="texto">Religião(os) para adicionarmos:</label>
        <textarea id="religiao" name="religiao" placeholder="Ex: Paganismo, Taoísta, etc."
            style="width:400px; height:90px;"></textarea><br>
        <label for="sitePesquisa" class="texto">Site(s) para pesquisarmos:</label>
        <textarea id="sitePesquisa" name="sitePesquisa" placeholder="Ex: https://www.google.com"
            style="width:400px; height:90px;"></textarea><br>
        <label for="extra" class="texto">Extras:</label>
        <textarea id="extra" name="extra" placeholder="Qualquer coisa em sua mente!"
            style="width:400px; height:90px;"></textarea><br>
        <input type="reset" value="Resetar" class="botoes">
        <input type="submit" value="Enviar" class="botoes">
    </form>
</body>
<script type="module" src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
    crossorigin="anonymous"></script>

</html>
